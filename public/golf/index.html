<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b7a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゴルフスコア">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>ゴルフスコア記録</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: one thumb-reachable screen per task. The count stays big and always visible so the stroke number is never lost. */
:root {
  --bg: #eef2ec;
  --surface: #ffffff;
  --fg: #15231b;
  --muted: #5b6b60;
  --line: #d5ddd3;
  --accent: #1b7a4a;
  --accent-fg: #ffffff;
  --accent-soft: #dcefe3;
  --warn: #a8480a;
  --warn-bg: #fbe9d4;
  --danger: #b3321f;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1511; --surface: #16211a; --fg: #e8efe9; --muted: #93a498; --line: #263329;
    --accent: #3fbf7a; --accent-fg: #04180d; --accent-soft: #17382a;
    --warn: #f0a35a; --warn-bg: #3a2a16; --danger: #ff8a78;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1511; --surface: #16211a; --fg: #e8efe9; --muted: #93a498; --line: #263329;
  --accent: #3fbf7a; --accent-fg: #04180d; --accent-soft: #17382a;
  --warn: #f0a35a; --warn-bg: #3a2a16; --danger: #ff8a78;
  color-scheme: dark;
}
:root {
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num, .tab { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

#app { height: 100%; max-width: 30rem; margin: 0 auto; padding-inline: 16px; display: flex; flex-direction: column; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding-block: 12px; }

/* top bar */
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; min-height: 52px; }
.bar > :last-child { justify-self: end; }
.ghost { white-space: nowrap; min-height: 44px; padding: 0 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 15px; }
.title { text-align: center; line-height: 1.1; }
.title b { font-family: var(--font-num); font-size: 40px; font-weight: 700; }
.title span { font-size: 14px; color: var(--muted); font-weight: 700; margin-left: 2px; }
.title small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.par { min-height: 44px; min-width: 76px; padding: 0 12px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); display: inline-flex; align-items: baseline; justify-content: center; gap: 6px; }
.par small { font-size: 11px; font-weight: 700; letter-spacing: .08em; align-self: center; }
.par b { font-family: var(--font-num); font-size: 28px; line-height: 1; }

/* progress dots */
.dots { display: flex; gap: 4px; justify-content: center; }
.dot { flex: 1; max-width: 18px; height: 8px; border-radius: 4px; background: var(--line); }
.dot.done { background: var(--accent); }
.dot.miss { background: var(--warn); }
.dot.cur { outline: 2px solid var(--fg); outline-offset: 1px; }

/* the count */
.count { text-align: center; padding-block: 4px; }
.count .label { font-size: 14px; color: var(--muted); font-weight: 700; }
.count .num { font-size: min(34vw, 9.5rem); line-height: .95; font-weight: 700; color: var(--fg); }
.count .num.zero { color: var(--muted); opacity: .55; }
.count .num.bump { animation: bump .22s ease-out; }
@keyframes bump { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }
.count .next { margin-top: 4px; font-size: 17px; font-weight: 700; min-height: 1.6em; }
.count .next b { font-family: var(--font-num); font-size: 26px; color: var(--accent); padding-inline: 2px; }

/* main action */
.hit { flex: 1 1 0; min-height: 132px; border-radius: 28px; background: var(--accent); color: var(--accent-fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 6px 0 rgba(0,0,0,.22); transition: transform .06s, box-shadow .06s; }
.hit:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
.hit .big { font-size: 34px; font-weight: 900; letter-spacing: .02em; }
.hit .sub { font-size: 14px; font-weight: 500; opacity: .9; }

.mid { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.undo { min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; color: var(--danger); }
.total { font-size: 14px; color: var(--muted); text-align: right; font-weight: 500; }
.total b { font-family: var(--font-num); font-size: 22px; color: var(--fg); font-weight: 700; }

.nav { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.nav button { min-height: 58px; border-radius: 16px; font-weight: 900; font-size: 18px; border: 2px solid var(--fg); background: var(--surface); }
.nav button.go { background: var(--fg); color: var(--bg); }
.nav button[disabled] { opacity: .35; }

/* scorecard */
.list { flex: 1; min-height: 0; overflow-y: auto; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.row { width: 100%; display: grid; grid-template-columns: 3.2rem 3rem 1fr 4.2rem; align-items: center; min-height: 46px; padding: 0 12px; border-bottom: 1px solid var(--line); text-align: left; }
.row > span { font-family: var(--font-num); font-size: 22px; font-weight: 600; }
.row > span:nth-child(2) { color: var(--muted); }
.row > span:nth-child(3) { font-size: 26px; font-weight: 700; text-align: center; }
.row > span:nth-child(4) { text-align: right; font-size: 20px; color: var(--muted); }
.row.head { min-height: 34px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.row.head > span { font-family: var(--font-body); font-size: 12px; font-weight: 700; color: var(--muted); }
.row.sub { background: var(--accent-soft); }
.row.sub > span { color: var(--accent); }
.row.all { background: var(--accent); }
.row.all > span { color: var(--accent-fg); }
.row.cur { box-shadow: inset 4px 0 0 var(--accent); background: var(--accent-soft); }
.row.miss > span:nth-child(3) { color: var(--warn); font-family: var(--font-body); font-size: 14px; font-weight: 700; }
.row .under { color: var(--accent); font-weight: 700; }
.row .none { color: var(--muted); opacity: .5; }
.foot { display: flex; gap: 10px; align-items: center; }
.foot .primary { flex: 1; min-height: 56px; border-radius: 16px; background: var(--accent); color: var(--accent-fg); font-weight: 900; font-size: 18px; }
.foot .quiet { min-height: 56px; padding: 0 12px; color: var(--danger); font-weight: 700; font-size: 14px; }
.banner { padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.note { padding: 10px 14px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); font-weight: 700; font-size: 14px; }

/* home */
.home { overflow-y: auto; gap: 16px; }
.home h1 { margin: 8px 0 0; font-size: 30px; font-weight: 900; line-height: 1.2; }
.home h1 small { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; font-size: 14px; color: var(--muted); font-weight: 700; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { min-height: 48px; border-radius: 12px; border: 2px solid var(--line); font-weight: 900; font-size: 18px; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.start { min-height: 64px; border-radius: 18px; background: var(--accent); color: var(--accent-fg); font-weight: 900; font-size: 22px; }
.resume-info { font-size: 16px; font-weight: 700; }
.resume-info .num { font-size: 30px; color: var(--accent); }
.steps { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.hist { display: flex; flex-direction: column; }
.hist button { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--line); text-align: left; min-height: 52px; }
.hist button:first-child { border-top: 0; }
.hist .d { font-weight: 700; }
.hist .d small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.hist .num { font-size: 28px; font-weight: 700; }
.hist .df { font-size: 18px; color: var(--muted); min-width: 2.6rem; text-align: right; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10; }
.scrim[hidden] { display: none; }
.sheet { width: 100%; max-width: 30rem; background: var(--surface); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.sheet h3 { margin: 0; font-size: 20px; font-weight: 900; }
.sheet p { margin: 0; font-size: 15px; }
.sheet .btns { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.sheet .btns button { min-height: 54px; border-radius: 14px; font-weight: 900; font-size: 17px; border: 2px solid var(--line); }
.sheet .btns .ok { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.sheet .btns .ok.danger { background: var(--danger); border-color: var(--danger); color: var(--bg); }

@media (max-height: 600px) {
  .count .num { font-size: 5.5rem; }
  .hit { min-height: 96px; }
  .hit .sub { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .count .num.bump { animation: none; }
  .hit { transition: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet"></div>
</div>
<script>
(function () {
  'use strict';
  var KEY = 'golf-score-v1';
  var db = { current: null, history: [] };
  var ui = { view: 'home', pastId: null, modal: null, homeHoles: 18, saved: false, bump: false };
  var lastHit = 0;

  function load() {
    try {
      var s = localStorage.getItem(KEY);
      if (s) {
        var d = JSON.parse(s);
        if (d && typeof d === 'object') {
          db.current = d.current || null;
          db.history = Array.isArray(d.history) ? d.history : [];
        }
      }
    } catch (e) {}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }

  function $(id) { return document.getElementById(id); }
  function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
  function diffText(d) { return d > 0 ? '+' + d : d < 0 ? '−' + (-d) : '±0'; }
  function total(r) {
    var played = 0, par = 0;
    r.strokes.forEach(function (s, i) { if (s > 0) { played += s; par += r.par[i]; } });
    return { strokes: played, diff: played - par, any: played > 0 };
  }
  function dateText(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return (d.getMonth() + 1) + '/' + d.getDate() + '（' + '日月火水木金土'[d.getDay()] + '）';
  }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  /* ---------- views ---------- */
  function holeView(r) {
    var i = r.idx, s = r.strokes[i], t = total(r);
    var dots = r.strokes.map(function (v, k) {
      var c = k === i ? 'cur ' : '';
      c += v > 0 ? 'done' : (k < i ? 'miss' : '');
      return '<i class="dot ' + c + '"></i>';
    }).join('');
    var last = i === r.holes - 1;
    return '<div class="screen">' +
      '<div class="bar">' +
        '<button class="ghost" data-act="card">スコア表</button>' +
        '<div class="title"><b>' + (i + 1) + '</b><span>番ホール</span><small>全' + r.holes + 'ホール</small></div>' +
        '<button class="par" data-act="par" aria-label="パーを変更"><small>PAR</small><b>' + r.par[i] + '</b></button>' +
      '</div>' +
      '<div class="dots" aria-hidden="true">' + dots + '</div>' +
      '<div class="count">' +
        '<div class="label">このホールの打数</div>' +
        '<div class="num' + (s === 0 ? ' zero' : '') + (ui.bump ? ' bump' : '') + '" aria-live="polite">' + s + '</div>' +
        '<div class="next">' + (s === 0 ? 'ティーショットを打ったら押す' : '次に打つのは<b>' + (s + 1) + '</b>打目') + '</div>' +
      '</div>' +
      '<button class="hit" data-act="hit"><span class="big">打った！ +1</span><span class="sub">1打ごとに、打ったらすぐ押す</span></button>' +
      '<div class="mid">' +
        '<button class="undo" data-act="undo"' + (s === 0 ? ' disabled style="opacity:.35"' : '') + '>−1 取り消し</button>' +
        '<div class="total">' + (t.any ? 'ここまで合計 <b>' + t.strokes + '</b>打 ' + diffText(t.diff) : 'ここまで合計 —') + '</div>' +
      '</div>' +
      '<div class="nav">' +
        '<button data-act="prev"' + (i === 0 ? ' disabled' : '') + '>← 前へ</button>' +
        '<button class="go" data-act="next">' + (last ? 'スコア表へ →' : '次のホール →') + '</button>' +
      '</div>' +
    '</div>';
  }

  function rowHtml(r, i, editable) {
    var s = r.strokes[i], d = s - r.par[i];
    var cls = 'row';
    if (editable && i === r.idx) cls += ' cur';
    if (editable && s === 0 && i < r.idx) cls += ' miss';
    var strokeCell = s > 0 ? s : (editable && i < r.idx ? '未記録' : '<i class="none">–</i>');
    var diffCell = s > 0 ? '<span' + (d < 0 ? ' class="under"' : '') + '>' + diffText(d) + '</span>' : '<span class="none">–</span>';
    var inner = '<span>' + (i + 1) + '</span><span>' + r.par[i] + '</span><span>' + strokeCell + '</span>' + diffCell;
    return editable
      ? '<button class="' + cls + '" data-act="goto" data-i="' + i + '">' + inner + '</button>'
      : '<div class="' + cls + '">' + inner + '</div>';
  }
  function subRow(label, r, from, to, cls) {
    var part = { strokes: r.strokes.slice(from, to), par: r.par.slice(from, to) };
    var t = total(part);
    return '<div class="row ' + cls + '"><span style="font-size:15px;font-family:var(--font-body);font-weight:700">' + label + '</span>' +
      '<span>' + sum(r.par.slice(from, to)) + '</span><span>' + (t.any ? t.strokes : '–') + '</span><span>' + (t.any ? diffText(t.diff) : '') + '</span></div>';
  }
  function cardRows(r, editable) {
    var out = '<div class="row head"><span>ホール</span><span>PAR</span><span style="text-align:center">打数</span><span style="text-align:right">±PAR</span></div>';
    var half = r.holes === 18 ? 9 : r.holes;
    var i;
    for (i = 0; i < half; i++) out += rowHtml(r, i, editable);
    if (r.holes === 18) {
      out += subRow('前半', r, 0, 9, 'sub');
      for (i = 9; i < 18; i++) out += rowHtml(r, i, editable);
      out += subRow('後半', r, 9, 18, 'sub');
    }
    out += subRow('合計', r, 0, r.holes, 'all');
    return out;
  }
  function missingCount(r) { return r.strokes.filter(function (v) { return v === 0; }).length; }

  function cardView(r, editable) {
    var t = total(r), miss = missingCount(r);
    var head = editable
      ? '<button class="ghost" data-act="back">← ホール</button>'
      : '<button class="ghost" data-act="home">← ホーム</button>';
    var right = editable ? '<button class="ghost" data-act="home">ホーム</button>' : '<span></span>';
    var foot = editable
      ? '<button class="quiet" data-act="ask-discard">破棄</button><button class="primary" data-act="ask-finish">ラウンド終了</button>'
      : '<button class="quiet" data-act="ask-delete">削除</button><button class="primary" data-act="home">ホームへ</button>';
    return '<div class="screen">' +
      '<div class="bar">' + head + '<div class="title"><b style="font-size:24px">スコア表</b>' +
        '<small>' + (editable ? '行をタップでそのホールへ' : dateText(r.date)) + '</small></div>' + right + '</div>' +
      (ui.saved ? '<div class="banner">保存しました。おつかれさまでした！</div>' : '') +
      (editable && miss > 0 && r.idx > 0 && r.strokes.slice(0, r.idx).indexOf(0) >= 0 ? '<div class="note">未記録のホールがあります。行をタップして入力できます。</div>' : '') +
      '<div class="list">' + cardRows(r, editable) + '</div>' +
      '<div class="foot">' + foot + '</div>' +
    '</div>';
  }

  function homeView() {
    var cur = db.current, out = '<div class="screen home"><h1>ゴルフスコア<small>1打ずつ、押すだけ。</small></h1>';
    if (cur) {
      var t = total(cur);
      out += '<div class="panel"><h2>ラウンド中</h2>' +
        '<div class="resume-info"><span class="num">' + (cur.idx + 1) + '</span>番ホール ・ ここまで<span class="num"> ' + t.strokes + ' </span>打</div>' +
        '<button class="start" data-act="resume">続きから</button></div>';
    } else {
      out += '<div class="panel"><h2>新しいラウンド</h2>' +
        '<div class="seg"><button data-act="holes" data-n="18" aria-pressed="' + (ui.homeHoles === 18) + '">18ホール</button>' +
        '<button data-act="holes" data-n="9" aria-pressed="' + (ui.homeHoles === 9) + '">9ホール</button></div>' +
        '<button class="start" data-act="start">ラウンド開始</button></div>';
    }
    out += '<div class="panel"><h2>つかいかた</h2><ol class="steps">' +
      '<li>1打打つたびに「打った！」を押す</li>' +
      '<li>ホールが終わったら「次のホール」</li>' +
      '<li>最後に「ラウンド終了」で保存</li></ol>' +
      '<p class="empty">打数は自動で保存されます。画面を閉じても、開き直すと続きから再開します。PARは最初すべて4です。必要なら右上のPARを押して3/4/5に変えられます。</p></div>';
    out += '<div class="panel"><h2>これまでのスコア</h2>';
    if (db.history.length === 0) out += '<p class="empty">まだ記録がありません。</p>';
    else out += '<div class="hist">' + db.history.slice(0, 50).map(function (h) {
      var t = total(h);
      return '<button data-act="open" data-id="' + h.id + '"><span class="d">' + dateText(h.date) + '<small>' + h.holes + 'H</small></span>' +
        '<span class="num">' + t.strokes + '</span><span class="df num">' + diffText(t.diff) + '</span></button>';
    }).join('') + '</div>';
    out += '</div></div>';
    return out;
  }

  function findPast() {
    for (var i = 0; i < db.history.length; i++) if (String(db.history[i].id) === String(ui.pastId)) return db.history[i];
    return null;
  }

  function render() {
    var html;
    if (ui.view === 'hole' && db.current) html = holeView(db.current);
    else if (ui.view === 'card' && db.current) html = cardView(db.current, true);
    else if (ui.view === 'past' && findPast()) html = cardView(findPast(), false);
    else { ui.view = 'home'; html = homeView(); }
    $('app').innerHTML = html;
    ui.bump = false;
    renderModal();
  }

  function renderModal() {
    var m = ui.modal, scrim = $('scrim'), sheet = $('sheet');
    if (!m) { scrim.hidden = true; return; }
    var r = db.current, body;
    if (m === 'finish') {
      var miss = r ? missingCount(r) : 0;
      body = '<h3 id="sheet-title">ラウンドを終了しますか？</h3>' +
        '<p>' + (miss > 0 ? '未記録のホールが' + miss + 'つあります。このまま保存すると「–」で残ります。' : 'スコアを保存して、ラウンドを終わります。') + '</p>' +
        '<div class="btns"><button data-act="close">戻る</button><button class="ok" data-act="finish">終了して保存</button></div>';
    } else if (m === 'discard') {
      body = '<h3 id="sheet-title">このラウンドを破棄しますか？</h3><p>入力した打数はすべて消えます。元に戻せません。</p>' +
        '<div class="btns"><button data-act="close">戻る</button><button class="ok danger" data-act="discard">破棄する</button></div>';
    } else {
      body = '<h3 id="sheet-title">この記録を削除しますか？</h3><p>元に戻せません。</p>' +
        '<div class="btns"><button data-act="close">戻る</button><button class="ok danger" data-act="delete">削除する</button></div>';
    }
    sheet.innerHTML = body;
    scrim.hidden = false;
  }

  /* ---------- actions ---------- */
  var actions = {
    hit: function () {
      var now = Date.now();
      if (now - lastHit < 300) return;           // ignore accidental double taps
      lastHit = now;
      var r = db.current;
      if (r.strokes[r.idx] < 30) { r.strokes[r.idx]++; ui.bump = true; buzz(25); save(); render(); }
    },
    undo: function () {
      var r = db.current;
      if (r.strokes[r.idx] > 0) { r.strokes[r.idx]--; save(); render(); }
    },
    par: function () { var r = db.current, p = r.par[r.idx]; r.par[r.idx] = p >= 5 ? 3 : p + 1; save(); render(); },
    prev: function () { var r = db.current; if (r.idx > 0) { r.idx--; save(); render(); } },
    next: function () {
      var r = db.current;
      if (r.idx < r.holes - 1) { r.idx++; save(); render(); }
      else { ui.view = 'card'; render(); }
    },
    card: function () { ui.view = 'card'; render(); },
    back: function () { ui.view = 'hole'; render(); },
    goto: function (el) { db.current.idx = +el.dataset.i; ui.view = 'hole'; save(); render(); },
    home: function () { ui.view = 'home'; ui.saved = false; render(); },
    holes: function (el) { ui.homeHoles = +el.dataset.n; render(); },
    start: function () {
      var n = ui.homeHoles;
      db.current = { id: Date.now(), date: new Date().toISOString(), holes: n, par: Array(n).fill(4), strokes: Array(n).fill(0), idx: 0 };
      ui.view = 'hole'; save(); render();
    },
    resume: function () { ui.view = 'hole'; render(); },
    open: function (el) { ui.pastId = el.dataset.id; ui.view = 'past'; ui.saved = false; render(); },
    'ask-finish': function () { ui.modal = 'finish'; renderModal(); },
    'ask-discard': function () { ui.modal = 'discard'; renderModal(); },
    'ask-delete': function () { ui.modal = 'delete'; renderModal(); },
    close: function () { ui.modal = null; renderModal(); },
    finish: function () {
      var r = db.current;
      db.history.unshift({ id: r.id, date: r.date, holes: r.holes, par: r.par, strokes: r.strokes });
      db.current = null; ui.pastId = r.id; ui.view = 'past'; ui.saved = true; ui.modal = null; save(); render();
    },
    discard: function () { db.current = null; ui.view = 'home'; ui.modal = null; save(); render(); },
    'delete': function () {
      db.history = db.history.filter(function (h) { return String(h.id) !== String(ui.pastId); });
      ui.view = 'home'; ui.modal = null; save(); render();
    }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = actions[el.dataset.act];
    if (fn) fn(el);
  });

  load();
  ui.view = db.current ? 'hole' : 'home';
  render();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
